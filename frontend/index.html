<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>To-Do List</h1>
            <button id="logoutBtn" class="logout-btn" hidden>Log out</button>
        </header>

        <p id="statusMessage" class="status-message" role="status"></p>

        <!-- ================= Authentication ================= -->
        <section id="authSection" class="card auth-card">
            <div class="tabs">
                <button id="tabLogin" class="tab active" type="button">Log in</button>
                <button id="tabSignup" class="tab" type="button">Sign up</button>
            </div>

            <form id="authForm" class="auth-form" autocomplete="on">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="text-input"
                    placeholder="your username"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="text-input"
                    placeholder="at least 6 characters"
                    minlength="6"
                    maxlength="72"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="authSubmit" class="primary-btn">Log in</button>
            </form>
        </section>

        <!-- ================= Task manager ================= -->
        <section id="appSection" hidden>
            <form id="taskForm" class="card task-form">
                <input
                    type="text"
                    id="taskTitle"
                    class="text-input"
                    placeholder="Enter task title"
                    maxlength="255"
                    required
                >
                <input
                    type="text"
                    id="taskDescription"
                    class="text-input"
                    placeholder="Description (optional)"
                    maxlength="1000"
                >
                <div class="form-row">
                    <select id="taskStatus" class="select-input">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In progress</option>
                        <option value="done">Done</option>
                    </select>
                    <input type="date" id="taskDueDate" class="text-input">
                    <button type="submit" class="add-btn">Add Task</button>
                </div>
            </form>

            <div class="filter-bar">
                <label for="statusFilter">Filter by status:</label>
                <select id="statusFilter" class="select-input">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="in-progress">In progress</option>
                    <option value="done">Done</option>
                </select>
            </div>

            <ul id="taskList" class="task-list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>

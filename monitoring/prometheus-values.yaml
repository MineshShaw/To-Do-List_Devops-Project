server:
  global:
    scrape_interval: 15s

  persistentVolume:
    enabled: false

  service:
    type: ClusterIP

  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']

    - job_name: 'todo-backend'
      static_configs:
        - targets: ['todo-app-backend-service:80']
      metrics_path: /metrics
      scrape_interval: 10s

alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

replicaCount: 2

backend:
  image:
    repository: ghcr.io/your-repo/backend
    tag: latest
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  env:
    DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/todo_db"
    CORS_ORIGINS: "http://todo-app.local"

frontend:
  image:
    repository: ghcr.io/your-repo/frontend
    tag: latest
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: todo-app.local
      paths:
        - path: /
          pathType: Prefix

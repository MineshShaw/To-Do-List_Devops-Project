name: DevSecOps CI/CD Pipeline

# Stage 1: Pre-Build Security Scanning  -> secret-scan, sast-backend, iac-scan
# Stage 2: Application Testing          -> test-backend
# Stage 3: Build & Container SCA        -> build-scan-backend, build-scan-frontend
# Stage 4: Registry Push                -> push-backend, push-frontend
#
# Every downstream stage uses `needs:` so a failed security gate stops the
# pipeline before any image is built, scanned or pushed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. `security-events: write` is required so the
# Gitleaks / Bandit actions can publish their SARIF reports to the Security tab.
permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.11'
  BACKEND_IMAGE: todo-backend
  FRONTEND_IMAGE: todo-frontend

jobs:

  # ==========================================================================
  # Stage 1 - Pre-Build Security Scanning
  # ==========================================================================

  # --- Job 1: Secret Scanning ----------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for org-owned repos; leave the secret unset otherwise.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # --- Job 2: SAST on the Python backend -----------------------------------
  sast-backend:
    name: SAST - Bandit (backend/app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # bandit-action performs its own checkout + Python setup.
      - name: Run Bandit SAST
        uses: PyCQA/bandit-action@v1
        with:
          targets: backend/app
          severity: high
          confidence: high
          python-version: ${{ env.PYTHON_VERSION }}

      # The official action runs `bandit ... || true`, so it never fails the
      # build itself. This gate turns HIGH findings into a hard failure.
      - name: Enforce Bandit gate (fail on HIGH findings)
        run: |
          count=$(jq '.runs[0].results // [] | length' results.sarif)
          echo "Bandit HIGH findings: ${count}"
          if [ "${count}" -gt 0 ]; then
            jq -r '.runs[0].results[] |
              "  [\(.level)] \(.message.text) -> \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
              results.sarif
            echo "::error::Bandit found ${count} HIGH severity issue(s)."
            exit 1
          fi

  # --- Job 3: IaC Scanning on Terraform ------------------------------------
  iac-scan:
    name: IaC Scanning (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on terraform/
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          quiet: true
          compact: true
          download_external_modules: true
          # Hard gate: do NOT soft-fail on misconfigurations.
          soft_fail: false

  # ==========================================================================
  # Stage 2 - Application Testing
  # ==========================================================================

  # --- Job 4: Backend unit tests -------------------------------------------
  test-backend:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocked until both secret + SAST gates have passed.
    needs: [secret-scan, sast-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          cd backend
          PYTHONPATH=$PWD DATABASE_URL=sqlite:///:memory: python -m pytest -v

  # ==========================================================================
  # Stage 3 - Build & Container Security (SCA with Trivy)
  # ==========================================================================

  # --- Job 5: Build + scan the backend image -------------------------------
  build-scan-backend:
    name: Build & Scan Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend

      - name: Scan backend image (Trivy - fail on HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Only reached if the scan above passed.
      - name: Save backend image to tarball
        run: docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -o backend-${{ github.sha }}.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: backend-${{ github.sha }}.tar
          retention-days: 1
          if-no-files-found: error

  # --- Job 6: Build + scan the frontend image ------------------------------
  build-scan-frontend:
    name: Build & Scan Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./frontend

      - name: Scan frontend image (Trivy - fail on HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Only reached if the scan above passed.
      - name: Save frontend image to tarball
        run: docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -o frontend-${{ github.sha }}.tar

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}
          path: frontend-${{ github.sha }}.tar
          retention-days: 1
          if-no-files-found: error

  # ==========================================================================
  # Stage 4 - Registry Push (only scanned, signed-off images)
  # ==========================================================================

  # --- Job 7: Push the backend image ---------------------------------------
  push-backend:
    name: Push Backend to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-scan-backend
    steps:
      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}

      - name: Load backend image
        run: docker load -i backend-${{ github.sha }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push backend image
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  # --- Job 8: Push the frontend image --------------------------------------
  push-frontend:
    name: Push Frontend to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-scan-frontend
    steps:
      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}

      - name: Load frontend image
        run: docker load -i frontend-${{ github.sha }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push frontend image
        run: |
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install psycopg2-binary 2>/dev/null || true

      - name: Run tests
        run: |
          cd backend
          PYTHONPATH=$PWD DATABASE_URL=sqlite:///:memory: python -m pytest -v

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t todo-backend:${{ github.sha }} ./backend

      - name: Save backend image to tarball
        run: |
          docker save todo-backend:${{ github.sha }} -o backend-${{ github.sha }}.tar

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: backend-${{ github.sha }}.tar

  scan-backend:
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}

      - name: Load backend image
        run: docker load -i backend-${{ github.sha }}.tar

      - name: Run Trivy vulnerability scan on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  build-frontend:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build -t todo-frontend:${{ github.sha }} ./frontend

      - name: Save frontend image to tarball
        run: |
          docker save todo-frontend:${{ github.sha }} -o frontend-${{ github.sha }}.tar

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}
          path: frontend-${{ github.sha }}.tar

  scan-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}

      - name: Load frontend image
        run: docker load -i frontend-${{ github.sha }}.tar

      - name: Run Trivy vulnerability scan on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  push-backend:
    needs: scan-backend
    runs-on: ubuntu-latest

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}

      - name: Load backend image
        run: |
          docker load -i backend-${{ github.sha }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push backend image
        run: |
          docker tag todo-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

  push-frontend:
    needs: scan-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}

      - name: Load frontend image
        run: |
          docker load -i frontend-${{ github.sha }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push frontend image
        run: |
          docker tag todo-frontend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
